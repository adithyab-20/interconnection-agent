services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: interconnection
      # Throwaway local DB — no password (trust auth). Keeps credentials out of
      # the repo entirely; never use trust auth for a real deployment.
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      # Bound to 127.0.0.1 so this trust-auth database is reachable only from this
      # machine, never from the LAN. host:container — host 5433 (not 5432) leaves
      # 5432 for a locally-installed Postgres; the default DATABASE_URL (see
      # .env.example) expects 5433.
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d interconnection"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
