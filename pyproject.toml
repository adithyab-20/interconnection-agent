[project]
name = "interconnection-agent"
version = "0.1.0"
description = "Verified interconnection-risk assessment grounded in public ISO queue data."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
    "mypy>=1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/interconnection_agent"]
# Each component's tests live in its own tests/ dir; they're for the repo, not
# the shipped package.
exclude = ["**/tests/**"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = ["src", "tests"]

[tool.pytest.ini_options]
# Unit tests live in each component's own tests/ dir (src/<component>/tests/);
# integration/e2e tests live under the top-level tests/. All are test_*.py.
testpaths = ["src", "tests"]
# src layout: import the package directly from src, so test collection does not
# depend on the editable install being present/intact. importlib mode keeps
# same-named test files in different dirs (e.g. integration/ and e2e/) from clashing.
pythonpath = ["src"]
addopts = ["-ra", "--import-mode=importlib"]
